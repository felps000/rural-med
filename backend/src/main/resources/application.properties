server.port=${PORT:8080}
# Atrás do proxy do Render: usa o IP e o protocolo reais do visitante
server.forward-headers-strategy=framework

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ruralmed?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# O Flyway cria o esquema; datas e prazos sao persistidos em UTC.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE_UTC

spring.jpa.show-sql=false

spring.jackson.serialization.fail-on-empty-beans=false

spring.mvc.format.date=iso
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# Segredo que assina os tokens de login (mínimo 32 caracteres). Em produção, defina JWT_SECRET.
ruralmed.jwt.segredo=${JWT_SECRET:}
